<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    브라우저 탭 아이콘. SVG 안의 미디어쿼리로 다크모드에 대응한다.
    색은 Tailwind 팔레트의 slate-900 / slate-50.
  -->
  <style>
    .bg { fill: #0f172a; }
    .fg { fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f8fafc; }
      .fg { fill: #0f172a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <text
    class="fg"
    x="16"
    y="23.5"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="700"
    text-anchor="middle"
  >k</text>
</svg>
